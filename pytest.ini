[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --strict-config
xfail_strict = true

# Markers — declare here so --strict-markers catches typos.
markers =
    slow: tests that take >1s (skip with `pytest -m 'not slow'`)
    integration: tests that read real artifacts from data/processed (skipped on fresh clone)
    requires_artifacts: alias for integration (clearer at the test site)

# Treat numerical/deprecation warnings as errors so they can't accumulate
# silently. Add narrow exemptions ONLY when a third-party lib is the source
# and there is no actionable fix on our side.
filterwarnings =
    error
    # pandas 'M' alias deprecation surfaces from older notebook output cells
    ignore::FutureWarning:pandas
    # statsmodels still emits these on Granger causality at low N
    ignore::FutureWarning:statsmodels
    # arch package emits ConvergenceWarning at low n
    ignore::UserWarning:arch
    # sklearn warns when input has all-zero variance (NB05 graph features)
    ignore::UserWarning:sklearn
